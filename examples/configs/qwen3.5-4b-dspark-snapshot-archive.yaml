model:
  target_model_path: /gpfs/models/huggingface.co/Qwen/Qwen3.5-4B
  draft_model_config: configs/qwen3.5-4b-dspark-target-kv.json
  target_backend: sglang
  embedding_key: model.language_model.embed_tokens.weight
  torch_dtype: bfloat16

data:
  max_length: 160
  dataloader_num_workers: 0
  mooncake_snapshots:
    archive_path: /datasets/qwen35-capture/snapshot-archive
    max_receive_bytes: 2147483648

training:
  strategy: dspark
  num_epochs: 1
  max_steps: 2
  batch_size: 1
  accumulation_steps: 1
  fsdp_sharding: NO_SHARD
  learning_rate: 6.0e-4
  warmup_ratio: 0.0
  max_grad_norm: 1.0
  attention_backend: sdpa
  num_anchors: 2
  loss_decay_gamma: null
  objective_chunk_blocks: 1
  save_interval: 1
  log_interval: 1
  max_checkpoints: 2
  seed: 42

run_id: qwen35-4b-dspark-snapshot-archive
output_dir: ./outputs/qwen35-4b-dspark-snapshot-archive

deployment:
  mode: local_colocated
  trainer:
    nnodes: 1
    nproc_per_node: 1
